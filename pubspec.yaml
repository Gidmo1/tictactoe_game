name: tictactoe_game
description: "A place to play tictactoe with everyone."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: "^1.12.0"
  sqflite: ^2.4.2
  supabase_flutter: ^2.9.0
  audioplayers: ^6.5.0
  flame_audio: ^2.11.10
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.0
  app_links: ^6.4.1
  connectivity_plus: ^4.0.0
  android_intent_plus: ^6.0.0
  share_plus: ^12.0.1
  uuid: ^3.0.7
  path: ^1.9.0

  



  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flame_test: ^2.0.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/annah.png
    - assets/images/david.png
    - assets/images/piper.png
    - assets/images/andrew.png
    - assets/images/champion.png
    - assets/images/finalist.png
    - assets/images/host.png
    - assets/images/first_tournament.png
    - assets/images/win_streak.png
    - assets/images/participant.png
    - assets/images/top_participant.png
    - assets/images/community_legend.png
    - assets/images/bracket_breaker.png
    - assets/images/most_improved.png
    - assets/images/mvp.png
    - assets/images/event_hero.png
    - assets/audio/lose.wav
    - assets/audio/win.wav
    - assets/audio/tap.wav
    - assets/audio/button.wav
    - assets/audio/background_music.mp3

